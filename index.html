<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGIHERA TECH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:wght@400;600;700&family=Manrope:wght@400;500;700;800&family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;700;800&family=Nunito:wght@400;700;800&family=Oswald:wght@400;600;700&family=Playfair+Display:wght@500;700;800&family=Poppins:wght@400;500;700;800&family=Raleway:wght@400;600;700;800&family=Roboto+Slab:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <div class="topbar-container">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu">&#9776;</button>

        <div class="logo-wrap">
          <div class="logo-mark" id="logoMark">D</div>
          <img id="logoImage" class="logo-image hidden" alt="Logo empresa">
          <div class="logo-text">
            <strong id="logoText">DIGIHERA TECH</strong>
            <span id="logoSubtext">Tecnologia, ofertas y contenido visual</span>
          </div>
        </div>

        <div class="search-wrap" id="searchWrap">
          <button class="search-toggle" id="searchToggle" type="button" aria-label="Abrir buscador">&#128269;</button>
          <div class="search-input-shell">
            <input type="text" id="buscadorGlobal" placeholder="Buscar productos, marcas o categorias">
          </div>
        </div>

        <div class="perfil-area" id="perfilArea">
          <img id="userAvatar" class="avatar hidden" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">
          <span id="userName" class="hidden"></span>
          <button id="loginBtn" type="button" class="ghost-btn" onclick="abrirLoginUsuario()">Iniciar sesion</button>
          <button id="carritoIcon" type="button" onclick="abrirCarrito()" class="cart-btn hidden">
            <span>🛒</span>
            <span id="carritoCount">0</span>
          </button>
          <div id="perfilMenu" class="perfil-menu hidden">
            <button type="button" onclick="openModal('loginModal')">Modo Administrador</button>
            <button type="button" onclick="abrirCarrito()">Carrito (<span id="menuCarritoCount">0</span>)</button>
            <button type="button" onclick="abrirFavoritos()">Favoritos</button>
            <button type="button" onclick="abrirPerfil()">Perfil</button>
            <button type="button" onclick="abrirHistorial()">Historial</button>
            <button type="button" onclick="cerrarSesion()">Cerrar sesion</button>
          </div>
        </div>
      </div>
    </header>

    <nav id="menuCatalogos" class="nav-desktop"></nav>
    <nav id="menuMobile" class="nav-mobile hidden"></nav>
    <section id="layoutTopSlot" class="layout-special-slot search-mode-hidden"></section>

    <section class="hero search-mode-hidden" id="heroSection">
      <div class="hero-grid" id="heroCards"></div>
      <div id="heroAdminTools" class="hero-admin hidden">
        <button type="button" onclick="abrirAjustesPaginaBuilder()">Ajustes de pagina</button>
        <button type="button" onclick="abrirPortadaBuilder()">Portada</button>
      </div>
    </section>

    <section class="slider-container search-mode-hidden" id="sliderContainer">
      <div class="slider" id="slider"></div>
      <button class="slider-btn prev" type="button" onclick="prevSlide()">❮</button>
      <button class="slider-btn next" type="button" onclick="nextSlide()">❯</button>
      <div class="slider-admin hidden" id="sliderAdmin">
        <button type="button" onclick="agregarSlide()">Agregar Slide</button>
        <button type="button" onclick="restaurarSlider()">Restaurar Slider</button>
      </div>
    </section>

    <div id="adminGlobalPanel" class="admin-global hidden">
      <button type="button" onclick="crearCatalogo()">Agregar Nuevo Catalogo</button>
    </div>

    <section id="builderTop" class="builder-zone search-mode-hidden"></section>
    <section id="builderAfterSlider" class="builder-zone search-mode-hidden"></section>

    <main class="main-content">
      <section id="layoutMiddleSlot" class="layout-special-slot search-mode-hidden"></section>
      <section id="builderMiddle" class="builder-zone search-mode-hidden"></section>
      <section id="catalogos"></section>
      <section id="layoutBottomSlot" class="layout-special-slot search-mode-hidden"></section>
      <section id="builderBottom" class="builder-zone search-mode-hidden"></section>
    </main>

    <section id="builderFooter" class="builder-zone builder-footer-zone search-mode-hidden"></section>
  </div>

  <aside id="builderSidebar" class="builder-sidebar hidden">
    <div class="builder-drag-handle" id="builderDragHandle">Mover panel</div>
    <div class="builder-sidebar-header">
      <div>
        <span class="eyebrow">Panel Builder</span>
        <h2>Constructor Visual</h2>
      </div>
      <button type="button" class="icon-btn" id="builderCloseBtn">✕</button>
    </div>

    <div class="builder-group">
      <label>Opacidad panel<input id="builderOpacityRange" type="range" min="0.55" max="1" step="0.05" value="1"></label>
    </div>

    <div class="builder-group">
      <div class="builder-group-title">Pagina</div>
      <div class="builder-action-row">
        <button type="button" id="builderPageBtn">Ajustes pagina</button>
        <button type="button" id="builderHeroBtn">Portada</button>
        <button type="button" id="builderBlocksBtn">Mis bloques</button>
      </div>
    </div>

    <div class="builder-group">
      <div class="builder-quick-grid">
        <button type="button" data-builder-type="texto">Texto</button>
        <button type="button" data-builder-type="imagen">Imagen</button>
        <button type="button" data-builder-type="slider">Slider</button>
        <button type="button" data-builder-type="video">Video</button>
        <button type="button" data-builder-type="youtube">YouTube</button>
        <button type="button" data-builder-type="embed">Red social</button>
        <button type="button" data-builder-type="whatsapp">WhatsApp</button>
        <button type="button" data-builder-type="banner">Banner</button>
        <button type="button" data-builder-type="destacados">Destacados</button>
        <button type="button" data-builder-type="ubicacion">Ubicacion</button>
        <button type="button" data-builder-type="piepagina">Pie de pagina</button>
        <button type="button" data-builder-type="espaciador">Espaciador</button>
      </div>
    </div>

    <div class="builder-group">
      <div class="builder-group-title">Mis Bloques</div>
      <div id="builderBlocksList" class="builder-blocks-list"></div>
    </div>

    <div class="builder-group">
      <div class="builder-tabs">
        <button type="button" class="active" data-builder-tab="contenido">Contenido</button>
        <button type="button" data-builder-tab="diseno">Diseno</button>
        <button type="button" data-builder-tab="animacion">Animacion</button>
        <button type="button" data-builder-tab="ubicacion">Ubicacion</button>
        <button type="button" data-builder-tab="avanzado">Avanzado</button>
      </div>
      <div id="builderInspector" class="builder-inspector"></div>
    </div>
  </aside>

  <div id="builderPanel">
    <button id="btnBuilderAdmin" type="button">Builder Pro</button>
  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Administrador</h2>
      <input type="text" id="username" placeholder="Usuario">
      <div class="password-box">
        <input id="adminPass" type="password" placeholder="Contrasena">
        <button type="button" onclick="togglePass('adminPass')">👁</button>
      </div>
      <div class="modal-actions">
        <button type="button" onclick="login()">Ingresar</button>
        <button type="button" class="ghost-btn" onclick="closeLogin()">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="imgModal" class="modal">
    <div class="img-modal-content slider-imagen">
      <button class="img-close-btn" id="imgModalClose" type="button" aria-label="Cerrar imagen">X</button>
      <img id="imgPreview" alt="Vista previa">
      <button class="img-btn prev" id="imgPrev" type="button">❮</button>
      <button class="img-btn next" id="imgNext" type="button">❯</button>
      <div class="img-modal-meta">
        <span id="imgModalCounter"></span>
        <button class="img-more-btn hidden" id="imgMoreBtn" type="button">Ver mas imagenes</button>
      </div>
      <div id="imgThumbs" class="img-modal-thumbs hidden"></div>
    </div>
  </div>

  <div id="loginUsuarioModal" class="modal">
    <div class="modal-content modal-lg">
      <h2>Tu cuenta</h2>
      <div class="split-grid">
        <div>
          <h3>Iniciar sesion</h3>
          <input id="loginUser" placeholder="Nombre de usuario">
          <div class="password-box">
            <input id="loginPass" type="password" placeholder="Contrasena">
            <button type="button" onclick="togglePass('loginPass')">👁</button>
          </div>
          <button type="button" onclick="loginUsuario()">Entrar</button>
        </div>
        <div>
          <h3>Crear cuenta</h3>
          <input id="regUser" placeholder="Nuevo usuario">
          <div class="password-box">
            <input id="regPass" type="password" placeholder="Nueva contrasena">
            <button type="button" onclick="togglePass('regPass')">👁</button>
          </div>
          <input type="file" id="regFoto" accept="image/*">
          <button type="button" onclick="registrarUsuario()">Registrarme</button>
        </div>
      </div>
      <button type="button" class="ghost-btn full-btn" onclick="cerrarLoginUsuario()">Cancelar</button>
    </div>
  </div>

  <div id="carritoModal" class="modal">
    <div class="modal-content modal-lg">
      <h2>Carrito</h2>
      <div id="carritoLista"></div>
      <h3 id="carritoTotal"></h3>
      <div class="modal-actions">
        <button type="button" onclick="enviarPedido()">Enviar pedido</button>
        <button type="button" class="ghost-btn" onclick="cerrarCarrito()">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="favoritosModal" class="modal">
    <div class="modal-content modal-lg">
      <h2>Favoritos</h2>
      <div id="favoritosLista"></div>
      <button type="button" class="ghost-btn full-btn" onclick="cerrarFavoritos()">Cerrar</button>
    </div>
  </div>

  <div id="perfilModal" class="modal">
    <div class="modal-content modal-lg">
      <h2>Perfil</h2>
      <input id="perfilNombre" placeholder="Nombre">
      <p class="profile-pass-row">
        Contrasena actual:
        <span id="passOculta">*****</span>
        <button type="button" onclick="verPasswordActual()">Ver</button>
      </p>
      <input type="file" id="perfilFoto" accept="image/*">
      <div class="password-box">
        <input type="password" id="perfilPassActual" placeholder="Contrasena actual">
        <button type="button" onclick="togglePass('perfilPassActual')">👁</button>
      </div>
      <div class="password-box">
        <input type="password" id="perfilPassNueva" placeholder="Nueva contrasena">
        <button type="button" onclick="togglePass('perfilPassNueva')">👁</button>
      </div>
      <div class="password-box">
        <input type="password" id="perfilPassConfirmar" placeholder="Confirmar nueva contrasena">
        <button type="button" onclick="togglePass('perfilPassConfirmar')">👁</button>
      </div>
      <div class="modal-actions">
        <button type="button" onclick="guardarPerfil()">Guardar cambios</button>
        <button type="button" class="danger-btn" onclick="eliminarCuenta()">Eliminar cuenta</button>
        <button type="button" class="ghost-btn" onclick="cerrarPerfil()">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="historialModal" class="modal">
    <div class="modal-content modal-lg">
      <h2>Historial de pedidos</h2>
      <div id="historialLista"></div>
      <button type="button" class="ghost-btn full-btn" onclick="cerrarHistorial()">Cerrar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ymkfextvphwfwtqpyung.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rMjC2VJst888Wr1ZXpoiEQ_hXjF7J7z";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.supabaseClient = supabaseClient;
  </script>
  <script src="script.js" defer></script>
  <script src="builder.js" defer></script>
</body>
</html>
